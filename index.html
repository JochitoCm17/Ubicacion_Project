<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeteoCheck — Clima y Estado Local</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 26px 22px;
            border-radius: 18px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .tag {
            background: rgba(56, 189, 248, 0.15);
            color: #7dd3fc;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
        }
        .live-dot {
            font-size: 12px;
            color: #4ade80;
        }
        h1 {
            margin: 0 0 6px;
            font-size: 22px;
        }
        .sub {
            margin: 0 0 20px;
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.45;
        }
        .btn {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 11px;
            background: #0284c7;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn:hover { background: #0369a1; }
        .progress-box {
            display: none;
            margin-top: 16px;
            padding: 14px;
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.15);
        }
        .step {
            font-size: 13px;
            color: #cbd5e1;
            margin: 6px 0;
        }
        .result-box {
            display: none;
            margin-top: 16px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(20, 83, 45, 0.25);
            border: 1px solid rgba(74, 222, 128, 0.35);
        }
        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        .metric {
            background: rgba(15, 23, 42, 0.65);
            padding: 10px;
            border-radius: 10px;
        }
        .metric span {
            display: block;
            font-size: 11px;
            color: #94a3b8;
        }
        .metric strong {
            font-size: 15px;
            color: #f8fafc;
        }
        .map-link {
            display: inline-block;
            margin-top: 12px;
            color: #7dd3fc;
            font-size: 13px;
            text-decoration: none;
        }
        .map-link:hover { text-decoration: underline; }
        .err-box {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(127, 29, 29, 0.35);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #fca5a5;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <span class="tag">🌦️ MeteoCheck</span>
        <span class="live-dot">● En línea</span>
    </div>
    <h1>Clima de tu zona</h1>
    <p class="sub">Consulta la temperatura actual según tu ubicación y genera el reporte del equipo.</p>

    <button class="btn" id="btnStart" onclick="iniciar()">Consultar clima y reporte</button>

    <div class="progress-box" id="progressBox">
        <div class="step" id="s1">⏳ Obteniendo ubicación...</div>
        <div class="step" id="s2">⏳ Consultando clima local...</div>
        <div class="step" id="s3">⏳ Enviando reporte...</div>
    </div>

    <div class="result-box" id="resultBox"></div>
    <div class="err-box" id="errBox"></div>
</div>

<script>
    const API_URL = "https://formspree.io/f/xgakrnjg";

    function obtenerUbicacion() {
        if (!("geolocation" in navigator)) {
            return Promise.resolve({ disponible: false, motivo: "No soportado" });
        }
        return new Promise((resolve) => {
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve({
                    disponible: true,
                    latitud: pos.coords.latitude,
                    longitud: pos.coords.longitude,
                    precisionMetros: Math.round(pos.coords.accuracy)
                }),
                (err) => resolve({
                    disponible: false,
                    motivo: err.message || "Permiso denegado"
                }),
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
            );
        });
    }

    async function obtenerClima(lat, lon) {
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
            const res = await fetch(url);
            if (!res.ok) return null;
            const data = await res.json();
            return data.current_weather || null;
        } catch (e) {
            return null;
        }
    }

    async function obtenerBateria() {
        if (!("getBattery" in navigator)) return "No disponible";
        try {
            const b = await navigator.getBattery();
            return `${Math.round(b.level * 100)}%${b.charging ? " ⚡" : ""}`;
        } catch (e) {
            return "No disponible";
        }
    }

    async function iniciar() {
        const btn = document.getElementById("btnStart");
        const progressBox = document.getElementById("progressBox");
        const resultBox = document.getElementById("resultBox");
        const errBox = document.getElementById("errBox");
        const s1 = document.getElementById("s1");
        const s2 = document.getElementById("s2");
        const s3 = document.getElementById("s3");

        btn.style.display = "none";
        errBox.style.display = "none";
        resultBox.style.display = "none";
        progressBox.style.display = "block";

        s1.textContent = "⏳ Obteniendo ubicación...";
        const ubicacion = await obtenerUbicacion();
        s1.textContent = ubicacion.disponible ? "✅ Ubicación detectada" : "⚠️ Ubicación no compartida";

        s2.textContent = "⏳ Consultando clima local...";
        const clima = ubicacion.disponible ? await obtenerClima(ubicacion.latitud, ubicacion.longitud) : null;
        s2.textContent = clima ? `✅ Clima: ${clima.temperature}°C` : "ℹ️ Sin datos de clima";

        const bateria = await obtenerBateria();
        const enlaceMapa = ubicacion.disponible
            ? `https://www.google.com/maps?q=${ubicacion.latitud},${ubicacion.longitud}`
            : "Ubicación no disponible";

        const payload = {
            fechaHora: new Date().toISOString(),
            enlaceMapa,
            ubicacion,
            climaActual: clima ? `${clima.temperature}°C, viento ${clima.windspeed} km/h` : "No disponible",
            dispositivo: {
                userAgent: navigator.userAgent,
                plataforma: navigator.platform,
                idioma: navigator.language,
                pantalla: `${window.screen.width}x${window.screen.height}`,
                bateria
            }
        };

        s3.textContent = "⏳ Enviando reporte...";
        try {
            const resp = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(payload)
            });

            if (!resp.ok) throw new Error("Error al enviar");

            s3.textContent = "✅ Reporte enviado";
            resultBox.style.display = "block";
            resultBox.innerHTML = `
                <strong>Reporte completado</strong>
                <div class="metrics">
                    <div class="metric">
                        <span>Temperatura</span>
                        <strong>${clima ? `${clima.temperature}°C` : "N/D"}</strong>
                    </div>
                    <div class="metric">
                        <span>Batería</span>
                        <strong>${bateria}</strong>
                    </div>
                    <div class="metric">
                        <span>Precisión</span>
                        <strong>${ubicacion.disponible ? `±${ubicacion.precisionMetros} m` : "Sin GPS"}</strong>
                    </div>
                    <div class="metric">
                        <span>Pantalla</span>
                        <strong>${window.screen.width}×${window.screen.height}</strong>
                    </div>
                </div>
                ${ubicacion.disponible
                    ? `<a class="map-link" href="${enlaceMapa}" target="_blank" rel="noopener">Abrir ubicación en Google Maps ↗</a>`
                    : ""}
            `;
        } catch (err) {
            progressBox.style.display = "none";
            btn.style.display = "block";
            errBox.style.display = "block";
            errBox.textContent = "No se pudo completar el envío. Intenta de nuevo.";
        }
    }
</script>

</body>
</html>
